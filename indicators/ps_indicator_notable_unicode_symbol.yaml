name: Notable unicode symbol
description: The idea is to spot notable symbols in the PS command payload. Adjust to your needs. Template detects modern emojis and dingbats. In SPL, use the \x notation. Please refer to FAQ 3.1 and reference below for other charset unicode ranges.
regex: [\p{Emoji}\p{inDingbats}]
basescore: 7.8
tactic: [TA0002, TA0005]
technique: [T1059.001, T1027]
reference:
  - https://www.unicode.org/charts/
  - https://www.regular-expressions.info/unicode.html
  - https://github.com/avasero/psexposed/blob/main/FAQ.md#31-a-few-notes-to-consider-when-using-regex-in-splunkspl
