name: Highly suspicious keywords
description: This indicator is designed to capture up to 2 strings with higher suspiciousness through multi-matching (see the maxmatch field below), avoiding the need to create numerous similar-value indicators. As a result, the regex will be long. If a particular string/pattern needs to be highlighted separately, it can be offloaded into its own indicator and removed from this one. The maxmatch field defines how many distinct matches are treated as separate instances of the indicator. It was initially inspired and later expanded from a few Sigma detections (refer to references).
