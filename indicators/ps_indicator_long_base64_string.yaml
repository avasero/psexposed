name: Long base64 strings
description: Because attackers stuf f all kinds of badness into base64 blobs even when they’re not using -EncodedCommand. Watching for long base64 inside PowerShell catches a bunch of common tradecraft.
regex: (?i)[a-z0-9+/=]{100,}
basescore: 7.0
tactic: [Defense Evasion, Execution]
technique: [T1027.001, T1059.001]
reference:
  - https://blogs.vmware.com/security/2023/03/how-to-detect-poshc2-powershell-implants.html
  - https://gist.github.com/githubfoam/0f6691b47a71486b25502e4e456d735e
