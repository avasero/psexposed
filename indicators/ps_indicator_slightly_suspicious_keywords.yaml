name: Slightly suspicious keywords
description: This is a generic indicator to match against a list of keywords, absolutely not malicious on their own but used for contextual enrichment and weak-signal correlation. Keywords might be removed and added to a more specific indicator in the future.
regex: silentlycontinue|Start\-Sleep|[-]verb\s+runas|Stop-Process\s.*-force|env:(TEMP|TMP|Path|USERNAME|COMPUTERNAME|SYSTEMROOT|WINDIR|HOMEDRIVE|HOMEPATH|USERPROFILE|SESSIONNAME|PROCESSOR_ARCHITECTURE)|-(whatif|UseBasicParsing)
basescore: 2.0
max_match: 1
tactic: TA0002
technique: [T1059.001]
reference:
  - https://attack.mitre.org/techniques/T1059/001/
