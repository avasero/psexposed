name: Validate Indicators (Pull Request)

on:
  pull_request_target:
    branches:
      - main
      - master
    paths:
      - 'indicators/**/*.yaml'
      - 'indicators/**/*.yml'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  step-1-detect-changes:
    name: "Step 1: Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.check-changes.outputs.has_changes }}
      changed-files: ${{ steps.check-changes.outputs.changed_files }}
      total-files: ${{ steps.check-changes.outputs.total_files }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: check-changes
        run: |
          echo "=== STEP 1: DETECT CHANGES ==="
          # Fetch the head branch of the PR so we can diff against it
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-head
          
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="pr-head"
          
          CHANGED_FILES=$(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" -- 'indicators/*.yaml' 'indicators/*.yml' || true)
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "changed_files=[]" >> $GITHUB_OUTPUT
            echo "total_files=0" >> $GITHUB_OUTPUT
            echo "No indicator files changed"
          else
            TOTAL=$(echo "$CHANGED_FILES" | wc -l)
            echo "Changed files ($TOTAL):"
            echo "$CHANGED_FILES"
            
            CHANGED_JSON=$(echo "$CHANGED_FILES" | jq -R -c . | jq -s -c '.')
            
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "changed_files=$CHANGED_JSON" >> $GITHUB_OUTPUT
            echo "total_files=$TOTAL" >> $GITHUB_OUTPUT
          fi

  step-2-yaml-syntax:
    name: "Step 2: YAML Syntax"
    needs: step-1-detect-changes
    if: needs.step-1-detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Validate YAML
        env:
          CHANGED_FILES: ${{ needs.step-1-detect-changes.outputs.changed-files }}
        run: |
          echo "=== STEP 2: YAML SYNTAX ==="
          pip install regex -q
          ERRORS=0

          cat > /tmp/validate_yaml.py << 'PYSCRIPT'
          import yaml
          import regex
          import sys
          
          filepath = sys.argv[1]
          with open(filepath, 'r', encoding='utf-8') as f:
              content = f.read()
          
          # Remove regex field entirely to avoid false positives from complex patterns
          content_no_regex = regex.sub(r'^regex:.*?(?=^\w|\Z)', '', content, flags=regex.MULTILINE | regex.DOTALL)

          try:
              yaml.safe_load(content_no_regex)
              print("  OK")
              sys.exit(0)
          except yaml.YAMLError as e:
              print(f"  YAML ERROR: {e}")
              sys.exit(1)
          PYSCRIPT

          for file in $(echo "$CHANGED_FILES" | jq -r '.[]'); do
            [ ! -f "$file" ] && continue
            echo "Checking: $file"
            python3 /tmp/validate_yaml.py "$file" || ERRORS=$((ERRORS + 1))
          done
          [ $ERRORS -gt 0 ] && echo "FAILED: $ERRORS file(s)" && exit 1
          echo "All YAML valid"

  step-3-required-fields:
    name: "Step 3: Required Fields"
    needs: [step-1-detect-changes, step-2-yaml-syntax]
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Check fields
        env:
          CHANGED_FILES: ${{ needs.step-1-detect-changes.outputs.changed-files }}
        run: |
          echo "=== STEP 3: REQUIRED FIELDS ==="
          REQUIRED="name description regex basescore tactic technique reference"
          ERRORS=0
          
          for file in $(echo "$CHANGED_FILES" | jq -r '.[]'); do
            [ ! -f "$file" ] && continue
            echo "Checking: $file"
            MISSING=""
            for field in $REQUIRED; do
              grep -q "^${field}:" "$file" || MISSING="$MISSING $field"
            done
            
            if [ -n "$MISSING" ]; then
              echo "  MISSING:$MISSING"
              ERRORS=$((ERRORS + 1))
            else
              echo "  OK"
            fi
          done
          
          [ $ERRORS -gt 0 ] && echo "FAILED" && exit 1
          echo "All fields present"
  step-3-5-duplicate-check:
    name: "Step 3.5: Duplicate Detection"
    needs: [step-1-detect-changes, step-3-required-fields]
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Check for duplicates
        env:
          UPSERT_FILES: ${{ needs.step-1-detect-changes.outputs.upsert-files }}
          SUPABASE_EDGE_URL: ${{ secrets.SUPABASE_EDGE_URL }}
          SUPABASE_EDGE_SECRET: ${{ secrets.SUPABASE_EDGE_SECRET }}
        run: |
          echo "=== STEP 3.5: DUPLICATE DETECTION ==="
          ERRORS=0
          
          # Create Python script for duplicate checking
          cat > /tmp/check_duplicates.py << 'PYSCRIPT'
          import os
          import sys
          import json
          import re
          import urllib.request
          import urllib.error
          
          def get_indicator_name(filepath):
              """Extract indicator name from YAML file."""
              try:
                  with open(filepath, 'r', encoding='utf-8') as f:
                      for line in f:
                          if line.startswith('name:'):
                              return line[5:].strip().strip('"').strip("'")
              except:
                  pass
              return None
          
          def get_all_repo_indicators(exclude_files):
              """Get all indicator names and file paths from the repository."""
              indicators = []
              indicators_dir = 'indicators'
              if os.path.exists(indicators_dir):
                  for fname in os.listdir(indicators_dir):
                      if fname.endswith(('.yaml', '.yml')):
                          fpath = os.path.join(indicators_dir, fname)
                          if fpath not in exclude_files:
                              name = get_indicator_name(fpath)
                              if name:
                                  indicators.append({'name': name.lower(), 'file': fpath, 'original_name': name})
              return indicators
          
          def check_db_duplicates(names_to_check, file_paths, edge_url, edge_secret):
              """Check if indicator names exist in Supabase database."""
              if not edge_url or not edge_secret:
                  print("  Skipping DB check (no credentials)")
                  return []
              
              duplicates = []
              
              # Build the endpoint URL
              if '/functions/v1' in edge_url:
                  url = f"{edge_url}/check-for-duplicates-on-pbDB"
              else:
                  url = f"{edge_url}/functions/v1/check-for-duplicates-on-pbDB"
              
              try:
                  payload = json.dumps({
                      'names': list(names_to_check),
                      'file_paths': list(file_paths)
                  }).encode('utf-8')
                  
                  req = urllib.request.Request(url, data=payload, method='POST')
                  req.add_header('Content-Type', 'application/json')
                  req.add_header('Authorization', f'Bearer {edge_secret}')
                  
                  with urllib.request.urlopen(req, timeout=30) as response:
                      result = json.loads(response.read().decode('utf-8'))
                      if result.get('duplicates'):
                          duplicates = result['duplicates']
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      print("  DB check endpoint not found (skipping)")
                  else:
                      print(f"  DB check error: {e.code}")
              except Exception as e:
                  print(f"  DB check skipped: {e}")
              
              return duplicates
          
          def main():
              upsert_files = json.loads(os.environ.get('UPSERT_FILES', '[]'))
              edge_url = os.environ.get('SUPABASE_EDGE_URL', '')
              edge_secret = os.environ.get('SUPABASE_EDGE_SECRET', '')
              
              if not upsert_files:
                  print("No files to check")
                  sys.exit(0)
              
              errors = 0
              
              # Get existing indicators in repo (excluding changed files)
              repo_indicators = get_all_repo_indicators(set(upsert_files))
              repo_names = {ind['name']: ind for ind in repo_indicators}
              
              # Check each file being added/modified
              names_to_check = set()
              file_paths = set()
              
              for fpath in upsert_files:
                  if not os.path.exists(fpath):
                      continue
                  
                  fname = os.path.basename(fpath)
                  print(f"Checking: {fpath}")
                  
                  # 1. Check for duplicate file names in repo
                  for other in repo_indicators:
                      if os.path.basename(other['file']) == fname:
                          print(f"  ERROR: Duplicate file name '{fname}' exists at {other['file']}")
                          errors += 1
                  
                  # 2. Check for duplicate indicator names in repo
                  ind_name = get_indicator_name(fpath)
                  if ind_name:
                      ind_name_lower = ind_name.lower()
                      names_to_check.add(ind_name_lower)
                      file_paths.add(fpath)
                      
                      if ind_name_lower in repo_names:
                          existing = repo_names[ind_name_lower]
                          print(f"  ERROR: Indicator name '{ind_name}' already exists in {existing['file']}")
                          errors += 1
                      else:
                          print(f"  Repo check OK for: {ind_name}")
              
              # 3. Check for duplicates in database
              if names_to_check:
                  print("\nChecking database for duplicates...")
                  db_dupes = check_db_duplicates(names_to_check, file_paths, edge_url, edge_secret)
                  for dupe in db_dupes:
                      print(f"  ERROR: Indicator name '{dupe['name']}' already exists in database (file: {dupe.get('file_path', 'unknown')})")
                      errors += 1
                  if not db_dupes:
                      print("  Database check OK")
              
              if errors > 0:
                  print(f"\nFAILED: {errors} duplicate(s) found")
                  sys.exit(1)
              
              print("\nNo duplicates found")
              sys.exit(0)
          
          if __name__ == '__main__':
              main()
          PYSCRIPT
          
          python3 /tmp/check_duplicates.py || ERRORS=$((ERRORS + 1))
          
          [ $ERRORS -gt 0 ] && exit 1
          echo "Duplicate check passed"

  step-4-data-types:
    name: "Step 4: Data Types"
    needs: [step-1-detect-changes, step-3-required-fields]
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Validate types
        env:
          CHANGED_FILES: ${{ needs.step-1-detect-changes.outputs.changed-files }}
        run: |
          echo "=== STEP 4: DATA TYPES ==="
          pip install regex -q
          ERRORS=0

          cat > /tmp/validate.py << 'PYSCRIPT'
          import yaml
          import regex
          import sys
          
          filepath = sys.argv[1]
          with open(filepath, 'r', encoding='utf-8') as f:
              content = f.read()
          
          # Remove regex field to avoid parsing issues
          content_no_regex = regex.sub(r'^regex:.*?(?=^\w|\Z)', '', content, flags=regex.MULTILINE | regex.DOTALL)
          data = yaml.safe_load(content_no_regex)

          errors = 0

          bs = data.get('basescore')
          try:
              val = float(bs)
              if not (0 <= val <= 10):
                  print(f"  basescore must be 0-10, got: {bs}")
                  errors += 1
          except:
              print(f"  basescore must be number, got: {bs}")
              errors += 1
          
          refs = data.get('reference', [])
          if isinstance(refs, str):
              refs = [refs]
          for ref in refs:
              if not (ref.startswith('http://') or ref.startswith('https://')):
                  print(f"  Invalid URL: {ref}")
                  errors += 1
          
          if errors == 0:
              print("  OK")
          sys.exit(errors)
          PYSCRIPT
          
          for file in $(echo "$CHANGED_FILES" | jq -r '.[]'); do
            [ ! -f "$file" ] && continue
            echo "Checking: $file"
            python3 /tmp/validate.py "$file" || ERRORS=$((ERRORS + 1))
          done
          
          [ $ERRORS -gt 0 ] && exit 1
          echo "All types valid"

  step-5-regex-patterns:
    name: "Step 5: Regex Patterns"
    needs: [step-1-detect-changes, step-4-data-types]
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Validate regex
        env:
          CHANGED_FILES: ${{ needs.step-1-detect-changes.outputs.changed-files }}
        run: |
          echo "=== STEP 5: REGEX PATTERNS ==="
          pip install regex -q
          ERRORS=0

          cat > /tmp/validate_regex.py << 'PYSCRIPT'
          import regex
          import sys
          
          def extract_regex_raw(filepath):
              """Extract regex pattern directly from file without YAML parsing."""
              with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              for line in content.split('\n'):
                  if line.startswith('regex:'):
                      value = line[6:].strip()
                      if value:
                          return value
              return None
          
          filepath = sys.argv[1]
          pattern = extract_regex_raw(filepath)
          
          if not pattern:
              print("No regex found")
              sys.exit(1)
          
          try:
              regex.compile(pattern)
              print("Regex valid")
              sys.exit(0)
          except regex.error as e:
              print(f"Invalid regex: {e}")
              sys.exit(1)
          PYSCRIPT
          
          for file in $(echo "$CHANGED_FILES" | jq -r '.[]'); do
            [ ! -f "$file" ] && continue
            echo "Checking: $file"
            python3 /tmp/validate_regex.py "$file" || ERRORS=$((ERRORS + 1))
          done
          
          [ $ERRORS -gt 0 ] && exit 1
          echo "All regex valid"

  validation-summary:
    name: "Validation Summary"
    needs: [step-1-detect-changes, step-2-yaml-syntax, step-3-required-fields, step-4-data-types, step-5-regex-patterns]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Post PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const steps = {
              'Step 1 - Detect': '${{ needs.step-1-detect-changes.result }}',
              'Step 2 - YAML': '${{ needs.step-2-yaml-syntax.result }}',
              'Step 3 - Fields': '${{ needs.step-3-required-fields.result }}',
              'Step 4 - Types': '${{ needs.step-4-data-types.result }}',
              'Step 5 - Regex': '${{ needs.step-5-regex-patterns.result }}'
            };
            
            const allPassed = Object.values(steps).every(r => r === 'success' || r === 'skipped');
            const icon = allPassed ? '✅' : '❌';
            const title = allPassed ? 'Validation Passed' : 'Validation Failed';
            
            let table = '| Step | Status |\n|------|--------|\n';
            for (const [step, result] of Object.entries(steps)) {
              const emoji = result === 'success' ? '✅' : result === 'skipped' ? '⏭️' : '❌';
              table += `| ${step} | ${emoji} ${result} |\n`;
            }
            
            let body = `## ${icon} ${title}\n\n${table}`;
            if (!allPassed) {
              body += `\n[View Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Check result
        run: |
          if [ "${{ needs.step-1-detect-changes.outputs.has-changes }}" = "true" ]; then
            if [ "${{ needs.step-5-regex-patterns.result }}" != "success" ]; then
              echo "ERROR: Validation chain failed or was skipped."
              exit 1
            fi
          fi
          echo "SUCCESS: Validation passed or no changes to validate."
