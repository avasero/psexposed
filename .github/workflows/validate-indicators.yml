name: Validate Indicators (Pull Request)

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'indicators/**/*.yaml'
      - 'indicators/**/*.yml'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  step-1-detect-changes:
    name: "Step 1: Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.check-changes.outputs.has_changes }}
      changed-files: ${{ steps.check-changes.outputs.changed_files }}
      total-files: ${{ steps.check-changes.outputs.total_files }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: check-changes
        run: |
          echo "=== STEP 1: DETECT CHANGES ==="
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'indicators/*.yaml' 'indicators/*.yml' || true)
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "changed_files=[]" >> $GITHUB_OUTPUT
            echo "total_files=0" >> $GITHUB_OUTPUT
            echo "No indicator files changed"
          else
            TOTAL=$(echo "$CHANGED_FILES" | wc -l)
            echo "Changed files ($TOTAL):"
            echo "$CHANGED_FILES"
            
            CHANGED_JSON=$(echo "$CHANGED_FILES" | jq -R -c . | jq -s -c '.')
            
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "changed_files=$CHANGED_JSON" >> $GITHUB_OUTPUT
            echo "total_files=$TOTAL" >> $GITHUB_OUTPUT
          fi

  step-2-yaml-syntax:
    name: "Step 2: YAML Syntax"
    needs: step-1-detect-changes
    if: needs.step-1-detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML
        env:
          CHANGED_FILES: ${{ needs.step-1-detect-changes.outputs.changed-files }}
        run: |
          echo "=== STEP 2: YAML SYNTAX ==="
          ERRORS=0
          
          cat > /tmp/validate_yaml.py << 'PYSCRIPT'
          import yaml
          import re
          import sys
          
          filepath = sys.argv[1]
          with open(filepath, 'r', encoding='utf-8') as f:
              content = f.read()
          
          # Remove regex field entirely to avoid false positives from complex patterns
          content_no_regex = re.sub( r'^regex: .+', '', content, flags=re.MULTILINE | re.DOTALL)
          
          try:
              yaml.safe_load(content_no_regex)
              print("  OK")
              sys.exit(0)
          except yaml.YAMLError as e:
              print(f"  YAML ERROR: {e}")
              sys.exit(1)
          PYSCRIPT
          
          for file in $(echo "$CHANGED_FILES" | jq -r '.[]'); do
            [ ! -f "$file" ] && continue
            echo "Checking: $file"
            python3 /tmp/validate_yaml.py "$file" || ERRORS=$((ERRORS + 1))
          done
          [ $ERRORS -gt 0 ] && echo "FAILED: $ERRORS file(s)" && exit 1
          echo "All YAML valid"

  step-3-required-fields:
    name: "Step 3: Required Fields"
    needs: [step-1-detect-changes, step-2-yaml-syntax]
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Check fields
        env:
          CHANGED_FILES: ${{ needs.step-1-detect-changes.outputs.changed-files }}
        run: |
          echo "=== STEP 3: REQUIRED FIELDS ==="
          REQUIRED="name description regex basescore tactic technique reference"
          ERRORS=0
          
          for file in $(echo "$CHANGED_FILES" | jq -r '.[]'); do
            [ ! -f "$file" ] && continue
            echo "Checking: $file"
            MISSING=""
            for field in $REQUIRED; do
              grep -q "^${field}:" "$file" || MISSING="$MISSING $field"
            done
            
            if [ -n "$MISSING" ]; then
              echo "  MISSING:$MISSING"
              ERRORS=$((ERRORS + 1))
            else
              echo "  OK"
            fi
          done
          
          [ $ERRORS -gt 0 ] && echo "FAILED" && exit 1
          echo "All fields present"

  step-4-data-types:
    name: "Step 4: Data Types"
    needs: [step-1-detect-changes, step-3-required-fields]
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Validate types
        env:
          CHANGED_FILES: ${{ needs.step-1-detect-changes.outputs.changed-files }}
        run: |
          echo "=== STEP 4: DATA TYPES ==="
          ERRORS=0
          
          cat > /tmp/validate.py << 'PYSCRIPT'
          import yaml
          import re
          import sys
          
          filepath = sys.argv[1]
          with open(filepath, 'r', encoding='utf-8') as f:
              content = f.read()
          
          # Remove regex field to avoid parsing issues
          content_no_regex = re.sub( r'^regex: .+', '', content, flags=re.MULTILINE | re.DOTALL)
          data = yaml.safe_load(content_no_regex)
          
          errors = 0
          
          bs = data.get('basescore')
          try:
              val = float(bs)
              if not (0 <= val <= 10):
                  print(f"  basescore must be 0-10, got: {bs}")
                  errors += 1
          except:
              print(f"  basescore must be number, got: {bs}")
              errors += 1
          
          refs = data.get('reference', [])
          if isinstance(refs, str):
              refs = [refs]
          for ref in refs:
              if not (ref.startswith('http://') or ref.startswith('https://')):
                  print(f"  Invalid URL: {ref}")
                  errors += 1
          
          if errors == 0:
              print("  OK")
          sys.exit(errors)
          PYSCRIPT
          
          for file in $(echo "$CHANGED_FILES" | jq -r '.[]'); do
            [ ! -f "$file" ] && continue
            echo "Checking: $file"
            python3 /tmp/validate.py "$file" || ERRORS=$((ERRORS + 1))
          done
          
          [ $ERRORS -gt 0 ] && exit 1
          echo "All types valid"

  step-5-regex-patterns:
    name: "Step 5: Regex Patterns"
    needs: [step-1-detect-changes, step-4-data-types]
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Validate regex
        env:
          CHANGED_FILES: ${{ needs.step-1-detect-changes.outputs.changed-files }}
        run: |
          echo "=== STEP 5: REGEX PATTERNS ==="
          ERRORS=0
          
          cat > /tmp/validate_regex.py << 'PYSCRIPT'
          import re
          import sys
          
          def extract_regex_raw(filepath):
              """Extract regex patterns directly from file without YAML parsing."""
              with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              patterns = []
              in_regex = False
              
              for line in content.split('\n'):
                  if line.startswith('regex:'):
                      in_regex = True
                      value = line[6:].strip()
                      if value and not value.startswith('#'):
                          if (value.startswith('"') and value.endswith('"')) or \
                             (value.startswith("'") and value.endswith("'")):
                              value = value[1:-1]
                          if value:
                              patterns.append(value)
                  elif in_regex:
                      stripped = line.strip()
                      if stripped.startswith('- '):
                          value = stripped[2:].strip()
                          if (value.startswith('"') and value.endswith('"')) or \
                             (value.startswith("'") and value.endswith("'")):
                              value = value[1:-1]
                          if value:
                              patterns.append(value)
                      elif stripped and not stripped.startswith('#') and not stripped.startswith('-'):
                          if re.match(r'^\w+:', stripped):
                              in_regex = False
              return patterns
          
          filepath = sys.argv[1]
          patterns = extract_regex_raw(filepath)
          
          errors = 0
          warnings = 0
          for p in patterns:
              if p.startswith('http://') or p.startswith('https://'):
                  print(f"  URL in regex: {p[:50]}")
                  errors += 1
                  continue
              try:
                  re.compile(p)
              except re.error as e:
                  err_str = str(e)
                  # Skip known Python regex limitations (valid in other engines)
                  if "bad escape \\p" in err_str or "bad escape \\P" in err_str:
                      warnings += 1
                  elif "unterminated character set" in err_str and "[" in p:
                      warnings += 1
                  else:
                      print(f"  Invalid regex: {e}")
                      errors += 1
          
          if errors == 0:
              print("  OK" + (f" ({warnings} warnings)" if warnings else ""))
          sys.exit(errors)
          PYSCRIPT
          
          for file in $(echo "$CHANGED_FILES" | jq -r '.[]'); do
            [ ! -f "$file" ] && continue
            echo "Checking: $file"
            python3 /tmp/validate_regex.py "$file" || ERRORS=$((ERRORS + 1))
          done
          
          [ $ERRORS -gt 0 ] && exit 1
          echo "All regex valid"

  validation-summary:
    name: "Validation Summary"
    needs: [step-1-detect-changes, step-2-yaml-syntax, step-3-required-fields, step-4-data-types, step-5-regex-patterns]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Post PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const steps = {
              'Step 1 - Detect': '${{ needs.step-1-detect-changes.result }}',
              'Step 2 - YAML': '${{ needs.step-2-yaml-syntax.result }}',
              'Step 3 - Fields': '${{ needs.step-3-required-fields.result }}',
              'Step 4 - Types': '${{ needs.step-4-data-types.result }}',
              'Step 5 - Regex': '${{ needs.step-5-regex-patterns.result }}'
            };
            
            const allPassed = Object.values(steps).every(r => r === 'success' || r === 'skipped');
            const icon = allPassed ? '✅' : '❌';
            const title = allPassed ? 'Validation Passed' : 'Validation Failed';
            
            let table = '| Step | Status |\n|------|--------|\n';
            for (const [step, result] of Object.entries(steps)) {
              const emoji = result === 'success' ? '✅' : result === 'skipped' ? '⏭️' : '❌';
              table += `| ${step} | ${emoji} ${result} |\n`;
            }
            
            let body = `## ${icon} ${title}\n\n${table}`;
            if (!allPassed) {
              body += `\n[View Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Check result
        run: |
          if [ "${{ needs.step-5-regex-patterns.result }}" != "success" ] && [ "${{ needs.step-5-regex-patterns.result }}" != "skipped" ]; then
            exit 1
          fi
