name: Create Linear issue on PR to main

on:
  pull_request:
    types: [opened]
    branches: [main]   # triggers when the PR's base is main

permissions:
  contents: read
  pull-requests: write

jobs:
  create-linear-issue:
    if: ${{ github.event.pull_request.head.repo.fork == false }} # avoid secrets on forks
    runs-on: ubuntu-latest
    steps:
      - name: Create Issue in Linear
        uses: actions/github-script@v7
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          LINEAR_PROJECT_ID: ${{ secrets.LINEAR_PROJECT_ID }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const query = `
              mutation IssueCreate($input: IssueCreateInput!) {
                issueCreate(input: $input) {
                  success
                  issue { id identifier url }
                }
              }`;

            const input = {
              teamId: process.env.LINEAR_TEAM_ID,
              title: `[New PR] ${pr.title}`,
              description:
                `PR: ${pr.html_url}\n` +
                `Author: @${pr.user.login}\n` +
                `Base: ${pr.base.ref}  Head: ${pr.head.ref}\n` +
                `Repo: ${context.repo.owner}/${context.repo.repo}\n\n` +
                (pr.body || ''),
            };

            if (process.env.LINEAR_PROJECT_ID) {
              input.projectId = process.env.LINEAR_PROJECT_ID;
            }

            const res = await fetch('https://api.linear.app/graphql', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': process.env.LINEAR_API_KEY
              },
              body: JSON.stringify({ query, variables: { input } })
            });

            const data = await res.json();
            if (!data?.data?.issueCreate?.success) {
              core.setFailed(`Linear issue creation failed: ${JSON.stringify(data)}`);
              return;
            }

            const issueUrl = data.data.issueCreate.issue.url;

            // Comment the Linear link back on the PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `📝 Created Linear issue: ${issueUrl}`
            });
