name: Update Database on any Indicator Changes

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'indicators/**'
      - '.github/workflows/update-database.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'indicators/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.check-changes.outputs.has_changes }}
      changed-files: ${{ steps.check-changes.outputs.changed_files }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for indicator changes
        id: check-changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Para PRs, comparar com a branch base
            BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
            CHANGED_FILES=$(git diff --name-only origin/$BASE_BRANCH...HEAD | grep '^indicators/.*\.yaml$' || true)
          else
            # Para pushes diretos, verificar mudanças nos últimos commits
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep '^indicators/.*\.yaml$' || true)
          fi
          
          if [ -n "$CHANGED_FILES" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            # Converter quebras de linha em espaços para evitar problemas de formato
            CHANGED_FILES_FORMATTED=$(echo "$CHANGED_FILES" | tr '\n' ' ')
            echo "changed_files=$CHANGED_FILES_FORMATTED" >> $GITHUB_OUTPUT
            echo "Found changes in indicators: $CHANGED_FILES"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes in indicators detected"
          fi

  update-database:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Supabase Database via Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CHANGED_FILES: ${{ needs.detect-changes.outputs.changed-files }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "Calling Edge Function to update database..."
          
          # Parse YAML files and convert to indicators
          INDICATORS_DATA="[]"
          
          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              echo "Processing $file..."
              
              # Extract key information from YAML (improved parsing)
              NAME=$(grep '^name:' "$file" | sed 's/name:[[:space:]]*//' | sed 's/^["\x27]//' | sed 's/["\x27]$//')
              DESCRIPTION=$(grep '^description:' "$file" | sed 's/description:[[:space:]]*//' | sed 's/^["\x27]//' | sed 's/["\x27]$//')
              BASESCORE=$(grep '^basescore:' "$file" | sed 's/basescore:[[:space:]]*//' | sed 's/^["\x27]//' | sed 's/["\x27]$//')
              
              # ✅ NOVO: Extract max_match
              MAX_MATCH=$(grep '^max_match:' "$file" | sed 's/max_match:[[:space:]]*//' | sed 's/^["\x27]//' | sed 's/["\x27]$//')
              if [ -z "$MAX_MATCH" ]; then
                MAX_MATCH="1"  # Valor padrão
              fi
              
              # ✅ CORRIGIDO: Extract arrays com parsing mais inteligente
              
              # Extract regex patterns - tratar tanto string simples quanto arrays
              if grep -q '^regex:.*["\x27].*["\x27]' "$file" || grep -q '^regex:[[:space:]]*[^[]*$' "$file"; then
                # String simples: regex: "pattern" ou regex: pattern - MANTER COMO ARRAY COM UM ELEMENTO
                REGEX_VALUE=$(grep '^regex:' "$file" | sed 's/regex:[[:space:]]*//' | sed 's/^["\x27]//' | sed 's/["\x27]$//')
                REGEX_PATTERNS=$(echo "$REGEX_VALUE" | jq -R '[.]')
              elif grep -q '^regex:.*\[' "$file"; then
                # Array inline: regex: [pattern1, pattern2]
                REGEX_PATTERNS=$(grep '^regex:' "$file" | sed 's/regex:[[:space:]]*\[//' | sed 's/\][[:space:]]*$//' | sed 's/,[[:space:]]*/\n/g' | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//' | sed 's/^["\x27]//' | sed 's/["\x27]$//' | jq -R . | jq -s .)
              else
                # Array multi-linha
                REGEX_PATTERNS=$(awk '/^regex:/{flag=1;next} /^[a-zA-Z_][a-zA-Z0-9_]*:/{flag=0} flag && /^[[:space:]]*-/{gsub(/^[[:space:]]*-[[:space:]]*/, ""); gsub(/^["\x27]|["\x27]$/, ""); if($0) print $0}' "$file" | jq -R . | jq -s .)
              fi
              
              # Extract tactics (para quando encontrar a próxima seção)
              if grep -q '^tactic:.*\[' "$file"; then
                # Array inline: tactic: [item1, item2]
                TACTICS=$(grep '^tactic:' "$file" | sed 's/tactic:[[:space:]]*\[//' | sed 's/\][[:space:]]*$//' | sed 's/,[[:space:]]*/\n/g' | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//' | sed 's/^["\x27]//' | sed 's/["\x27]$//' | jq -R . | jq -s .)
              else
                # Array multi-linha
                TACTICS=$(awk '/^tactic:/{flag=1;next} /^[a-zA-Z_][a-zA-Z0-9_]*:/{flag=0} flag && /^[[:space:]]*-/{gsub(/^[[:space:]]*-[[:space:]]*/, ""); gsub(/^["\x27]|["\x27]$/, ""); if($0) print $0}' "$file" | jq -R . | jq -s .)
              fi
              
              # Extract techniques (para quando encontrar a próxima seção)
              if grep -q '^technique:.*\[' "$file"; then
                # Array inline: technique: [item1, item2]
                TECHNIQUES=$(grep '^technique:' "$file" | sed 's/technique:[[:space:]]*\[//' | sed 's/\][[:space:]]*$//' | sed 's/,[[:space:]]*/\n/g' | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//' | sed 's/^["\x27]//' | sed 's/["\x27]$//' | jq -R . | jq -s .)
              else
                # Array multi-linha
                TECHNIQUES=$(awk '/^technique:/{flag=1;next} /^[a-zA-Z_][a-zA-Z0-9_]*:/{flag=0} flag && /^[[:space:]]*-/{gsub(/^[[:space:]]*-[[:space:]]*/, ""); gsub(/^["\x27]|["\x27]$/, ""); if($0) print $0}' "$file" | jq -R . | jq -s .)
              fi
              
              # Extract references (para quando encontrar a próxima seção ou fim do arquivo)
              REFERENCES=$(awk '/^reference:/{flag=1;next} /^[a-zA-Z_][a-zA-Z0-9_]*:/{flag=0} flag && /^[[:space:]]*-/{gsub(/^[[:space:]]*-[[:space:]]*/, ""); gsub(/^["\x27]|["\x27]$/, ""); if($0) print $0}' "$file" | jq -R . | jq -s .)
              
              # ✅ NOVO: Generate link based on file path
              LINK="https://github.com/avasero/psexposed/blob/main/$file"
              
              # ✅ NOVO: Generate GitHub avatar URL
              GITHUB_AVATAR="https://github.com/${GITHUB_ACTOR}.png"
              
              echo "Debug - Extracted values:"
              echo "  FILE_PATH: $file"
              echo "  NAME: $NAME"
              echo "  BASESCORE: $BASESCORE"
              echo "  MAX_MATCH: $MAX_MATCH"
              echo "  REGEX_PATTERNS: $REGEX_PATTERNS"
              echo "  TACTICS: $TACTICS"
              echo "  TECHNIQUES: $TECHNIQUES"
              echo "  REFERENCES: $REFERENCES"
              echo "  LINK: $LINK"
              echo "  LAST_MODIFIED_BY: $GITHUB_ACTOR"
              echo "  GITHUB_AVATAR: $GITHUB_AVATAR"
              
              # ✅ CORRIGIDO: Build indicator JSON com max_match, link e file_path como identificador único
              INDICATOR_JSON=$(jq -n \
                --arg name "$NAME" \
                --arg description "$DESCRIPTION" \
                --arg basescore "$BASESCORE" \
                --arg max_match "$MAX_MATCH" \
                --arg link "$LINK" \
                --arg file_path "$file" \
                --arg last_modified_by "$GITHUB_ACTOR" \
                --arg last_modified_by_avatar "$GITHUB_AVATAR" \
                --argjson regex "$REGEX_PATTERNS" \
                --argjson tactic "$TACTICS" \
                --argjson technique "$TECHNIQUES" \
                --argjson reference "$REFERENCES" \
                '{
                  name: $name,
                  description: $description,
                  basescore: ($basescore | tonumber),
                  max_match: ($max_match | tonumber),
                  regex: $regex,
                  tactic: $tactic,
                  technique: $technique,
                  reference: $reference,
                  link: $link,
                  file_path: $file_path,
                  last_modified_by: $last_modified_by,
                  last_modified_by_avatar: $last_modified_by_avatar
                }')
              
              echo "Generated JSON: $INDICATOR_JSON"
              
              # Add to indicators array
              INDICATORS_DATA=$(echo "$INDICATORS_DATA" | jq ". += [$INDICATOR_JSON]")
            fi
          done
          
          # Call Edge Function
          PAYLOAD=$(jq -n \
            --argjson indicators "$INDICATORS_DATA" \
            --arg changed_files "$CHANGED_FILES" \
            '{
              indicators: $indicators,
              changed_files: ($changed_files | split(" "))
            }')
          
          echo "Payload: $PAYLOAD"
          
          RESPONSE=$(curl -s -X POST "$SUPABASE_URL/functions/v1/update-database" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -d "$PAYLOAD")
          
          echo "Response: $RESPONSE"
          
          # Check if successful
          if echo "$RESPONSE" | jq -e '.success' > /dev/null; then
            echo "✅ Database updated successfully!"
            PROCESSED=$(echo "$RESPONSE" | jq -r '.indicators_processed // 0')
            echo "Processed $PROCESSED indicators"
          else
            echo "❌ Failed to update database"
            echo "$RESPONSE" | jq -r '.error // "Unknown error"'
            exit 1
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Database updated successfully')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: `✅ **Database atualizado com sucesso!**\n\nOs seguintes indicadores foram processados:\n${{ needs.detect-changes.outputs.changed-files }}\n\nO banco de dados Supabase foi atualizado automaticamente.`
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `✅ **Database atualizado com sucesso!**\n\nOs seguintes indicadores foram processados:\n${{ needs.detect-changes.outputs.changed-files }}\n\nO banco de dados Supabase foi atualizado automaticamente.`
              });
            }

