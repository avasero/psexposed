name: Update Public Indicators

on:
  push:
    paths:
      - "indicators/**/*.yaml"
      - "indicators/**/*.yml"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Detect changed YAML files
        id: changes
        run: |
          # Tentativa normal — funciona quando há commit anterior
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- "indicators/**/*.ya*" || true)

          # Fallback — primeiro commit ou ausência de diff
          if [ -z "$CHANGED" ]; then
            echo "Fallback: listando todos YAMLs"
            CHANGED=$(ls indicators/*.ya* 2>/dev/null || true)
          fi

          echo "Arquivos encontrados:"
          echo "$CHANGED"

          # Gera JSON estruturado
          jq -n --arg files "$CHANGED" '
            {
              files: ($files | split("\n") | map(select(length > 0)))
            }
          ' > changed.json

          echo "JSON gerado:"
          cat changed.json

          # Exporta JSON corretamente (multilinha)
          {
            echo "json<<EOF"
            cat changed.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Stop if no YAMLs
        if: ${{ fromJson(steps.changes.outputs.json).files == '' }}
        run: |
          echo "Nenhum YAML encontrado. Encerrando."
          exit 0

      - name: Send YAMLs to Supabase
        run: |
          # Recupera a lista de arquivos
          FILES=$(echo '${{ steps.changes.outputs.json }}' | jq -r '.files[]')

          for file in $FILES; do
            echo "Processando: $file"
            
            # --- CORREÇÃO CRÍTICA AQUI ---
            # Usa jq --rawfile para ler o arquivo YAML inteiro de forma segura
            # Isso evita erros de aspas, quebras de linha e caracteres especiais
            jq -n \
              --arg fp "$file" \
              --rawfile content "$file" \
              '{file_path: $fp, content: $content}' > payload.json

            # Envia usando o arquivo payload.json gerado
            HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $SUPABASE_EDGE_SECRET" \
              -d @payload.json \
              "$SUPABASE_EDGE_URL")

            echo "HTTP Code: $HTTP_CODE"
            cat response.txt
            echo ""
            echo "-------------------------------"

            if [ "$HTTP_CODE" -ne 200 ]; then
              echo "::error::Falha ao enviar $file"
              exit 1
            fi
          done
        env:
          SUPABASE_EDGE_URL: ${{ secrets.SUPABASE_EDGE_URL }}
          SUPABASE_EDGE_SECRET: ${{ secrets.SUPABASE_EDGE_SECRET }}
